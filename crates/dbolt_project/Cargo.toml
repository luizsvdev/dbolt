[package]
name = "dbolt_project"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/dbolt_project.rs"

[dependencies]
dbolt_database = { version = "0.1.0", path = "../dbolt_database" }
dirs = "6.0.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
